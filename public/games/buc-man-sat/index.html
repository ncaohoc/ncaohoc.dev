<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bức Màn Sắt</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #171a15; }
      #unity-canvas { display: block; width: 100%; height: 100%; outline: none; background: #171a15; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; color: #e8cf7a; font: 600 16px/1.4 system-ui, sans-serif; letter-spacing: 0.02em;
      }
      #loading .bar { width: min(320px, 60vw); height: 6px; border-radius: 3px; background: #2f3529; overflow: hidden; }
      #loading .fill { width: 0; height: 100%; background: #e0b040; transition: width 0.2s; }
      #loading.error { color: #f08a7a; text-align: center; padding: 0 24px; }
    </style>
  </head>
  <body>
    <!-- Canvas fills the page (the page itself sits in an iframe on ncaohoc.dev). -->
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div class="label">Đang tải Bức Màn Sắt…</div>
      <div class="bar"><div class="fill"></div></div>
    </div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = loading.querySelector(".fill");
      // Clicking into the frame gives the game keyboard focus.
      document.addEventListener("pointerdown", function () { canvas.focus(); });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ncaohoc",
        productName: "Bức Màn Sắt",
        productVersion: "0.1.0",
      }, function (progress) {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        loading.remove();
        canvas.focus();
      }).catch(function (message) {
        loading.className = "error";
        loading.textContent = "Không chạy được game trên trình duyệt này: " + message;
      });
    </script>
  </body>
</html>
